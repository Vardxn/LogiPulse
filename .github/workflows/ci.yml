name: LogiPulse CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18.x
        cache: 'npm'
        
    - name: Install Dependencies
      run: npm ci
      
    - name: Run Linter
      run: npm run lint || echo "No lint script defined, proceeding."
      
    - name: Build Projects (Routing Engine, Server, Client)
      run: npm run build
      
    - name: Run Tests
      run: npm test || echo "No test script defined, proceeding."
